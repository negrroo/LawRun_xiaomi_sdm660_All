name: Build sdm660 whyred release installers (Station recipe, NEWCAM + OLDCAM)
on:
  workflow_dispatch:
  push:
    branches: [next-4.4-st79-donors]
    paths: ['.github/workflows/build-whyred-release.yml']
env:
  VER: '22.0'
  REPO: LawRun_xiaomi_sdm660_All
jobs:
  kernel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cam: [NEWCAM, OLDCAM]
        fw: [Latest, Old]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Toolchains and overlays
        run: |
          sudo mkdir -p /home/negrroo/Kernel && sudo chown -R $USER /home/negrroo
          git clone -q --depth 1 https://github.com/negrroo/KernelSU-Next -b next /home/negrroo/Kernel/KernelSU
          sudo apt-get update -q && sudo apt-get install -y -q bc bison flex libssl-dev libelf-dev ccache rsync
          git clone -q --depth 1 -b 11.0 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-7211189 /opt/clang
          git clone -q --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /opt/gcc
          git clone -q --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 /opt/gcc32
          git clone -q --depth 1 -b ci-overlays https://github.com/negrroo/${REPO} /opt/ov
      - name: Build ${{ matrix.cam }} ${{ matrix.fw }}
        run: |
          export PATH="/opt/clang/bin:/opt/gcc/bin:/opt/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER=negrroo KBUILD_BUILD_HOST=lawrun
          S=/opt/ov/Specifications/Whyred
          [ "${{ matrix.fw }}" = Latest ] && Q=Qti_Support || Q=Qti_Nope
          rsync -r $S/Sk_CPU/ .
          rsync -r $S/$Q/ .
          cp arch/arm64/configs/whyred_defconfig arch/arm64/configs/LawRun_defconfig
          sed -i "s/21\.4_NEWCAM/${VER}_${{ matrix.cam }}/" arch/arm64/configs/LawRun_defconfig
          if [ "${{ matrix.cam }}" = OLDCAM ]; then sed -i 's/^CONFIG_MACH_XIAOMI_NEW_CAMERA=y/# CONFIG_MACH_XIAOMI_NEW_CAMERA is not set/' arch/arm64/configs/LawRun_defconfig; fi
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' arch/arm64/configs/LawRun_defconfig
          grep -E 'CONFIG_LOCALVERSION|MACH_XIAOMI_NEW_CAMERA' arch/arm64/configs/LawRun_defconfig
          make O=kout ARCH=arm64 LawRun_defconfig
          grep -E 'CONFIG_LOCALVERSION=|MACH_XIAOMI_NEW_CAMERA' kout/.config
          make -j$(nproc) O=kout ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS='-w' 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
          ls -la kout/arch/arm64/boot/
          cp kout/arch/arm64/boot/Image.gz Image.gz-${{ matrix.cam }}-${{ matrix.fw }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ matrix.cam }}-${{ matrix.fw }}
          path: |
            Image.gz-${{ matrix.cam }}-${{ matrix.fw }}
            build.log
  dtbs:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { code: '0000', q: Qti_Nope, cpu: Sk }
          - { code: '1000', q: Qti_Nope, cpu: OC }
          - { code: '1111', q: Qti_Nope, cpu: Hyper }
          - { code: '0001', q: Qti_Support, cpu: Sk }
          - { code: '1001', q: Qti_Support, cpu: OC }
          - { code: '0111', q: Qti_Support, cpu: Hyper }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Toolchains and overlays
        run: |
          sudo mkdir -p /home/negrroo/Kernel && sudo chown -R $USER /home/negrroo
          git clone -q --depth 1 https://github.com/negrroo/KernelSU-Next -b next /home/negrroo/Kernel/KernelSU
          sudo apt-get update -q && sudo apt-get install -y -q bc bison flex libssl-dev libelf-dev ccache rsync
          git clone -q --depth 1 -b 11.0 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-7211189 /opt/clang
          git clone -q --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /opt/gcc
          git clone -q --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 /opt/gcc32
          git clone -q --depth 1 -b ci-overlays https://github.com/negrroo/${REPO} /opt/ov
      - name: Build dtb ${{ matrix.code }}
        run: |
          export PATH="/opt/clang/bin:/opt/gcc/bin:/opt/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER=negrroo KBUILD_BUILD_HOST=lawrun
          S=/opt/ov/Specifications/Whyred
          Q=${{ matrix.q }}
          CPU=${{ matrix.cpu }}
          rsync -r $S/Sk_CPU/ .
          rsync -r $S/$Q/ .
          [ "$CPU" != Sk ] && rsync -r $S/${CPU}_CPU/ . || true
          cp arch/arm64/configs/whyred_defconfig arch/arm64/configs/LawRun_defconfig
          sed -i "s/21\.4_NEWCAM/22.0_NEWCAM/" arch/arm64/configs/LawRun_defconfig
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' arch/arm64/configs/LawRun_defconfig
          make O=kout ARCH=arm64 LawRun_defconfig
          make -j$(nproc) O=kout ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS='-w' dtbs 2>&1 | tee dtb.log; test ${PIPESTATUS[0]} -eq 0
          mkdir -p dtbout/${{ matrix.code }} && cp kout/arch/arm64/boot/dts/qcom/*.dtb dtbout/${{ matrix.code }}/
          ls -la dtbout/${{ matrix.code }}
      - uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ matrix.code }}
          path: dtbout
  package:
    needs: [kernel , dtbs]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cam: [NEWCAM, OLDCAM]
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Package into his installer
        run: |
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(urllib.request.urlopen("https://api.kde-look.org/ocs/v1/content/data/2037603?format=json"))["data"][0]
          for i in range(1, 80):
              if d.get("downloadname%d" % i) == "LawRun-660-whyred-21.5-NEWCAM.zip":
                  open("template_url.txt", "w").write(d["downloadlink%d" % i]); break
          PY
          curl -sL -o template.zip "$(cat template_url.txt)"
          mkdir pkg && cd pkg && unzip -q ../template.zip
          cp ../art/kernel-${{ matrix.cam }}-Latest/Image.gz-${{ matrix.cam }}-Latest LawRun-Kernel/kernel/Latest/Image.gz
          cp ../art/kernel-${{ matrix.cam }}-Old/Image.gz-${{ matrix.cam }}-Old LawRun-Kernel/kernel/Old/Image.gz
          for c in ../art/dtb-*/*; do code=$(basename $c); rm -f LawRun-Kernel/kernel/Specific/$code/*.dtb; cp $c/*.dtb LawRun-Kernel/kernel/Specific/$code/; done
          echo "v${VER} | Uv-Build | Universal | 2026-12-01" > version
          NAME=LawRun-660-whyred-${VER}-${{ matrix.cam }}.zip
          zip -qr9 ../$NAME . -x '.git*'
          cd ..
          unzip -Z1 template.zip | sort > a.txt; unzip -Z1 $NAME | sort > b.txt
          echo "== file list diff template(<) vs new(>)"; diff a.txt b.txt && echo IDENTICAL_LAYOUT
          echo "== device folders"; ls pkg/LawRun-Kernel/Check
          ls -la $NAME
          md5sum $NAME
          mkdir out && mv $NAME out/
      - uses: actions/upload-artifact@v4
        with:
          name: LawRun-660-whyred-22.0-${{ matrix.cam }}
          path: out/
          compression-level: 0
