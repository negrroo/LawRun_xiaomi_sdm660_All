name: Build sdm660 compile check (lavender, whyred, wayne)
on:
  push:
    branches: [next-4.4-st79-donors, perf-sdm845-port]
jobs:
  kernel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        dev: [lavender, whyred, wayne]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Toolchains
        run: |
          sudo mkdir -p /home/negrroo/Kernel && sudo chown -R $USER /home/negrroo
          git clone -q --depth 1 https://github.com/negrroo/KernelSU-Next -b next /home/negrroo/Kernel/KernelSU
          sudo apt-get update -q && sudo apt-get install -y -q bc bison flex libssl-dev libelf-dev ccache python2 || sudo apt-get install -y -q bc bison flex libssl-dev libelf-dev ccache
          git clone -q --depth 1 -b 11.0 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-7211189 /opt/clang
          git clone -q --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /opt/gcc
          git clone -q --depth 1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 /opt/gcc32
      - name: Build ${{ matrix.dev }}
        run: |
          export PATH="/opt/clang/bin:/opt/gcc/bin:/opt/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER=negrroo KBUILD_BUILD_HOST=lawrun
          make O=kout ARCH=arm64 ${{ matrix.dev }}_defconfig
          make -k -j$(nproc) O=kout ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS='-w' 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
          ls -la kout/arch/arm64/boot/
          cp kout/arch/arm64/boot/Image.gz-dtb Image.gz-dtb-${{ matrix.dev }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdm660-${{ matrix.dev }}
          path: |
            Image.gz-dtb-${{ matrix.dev }}
            build.log
